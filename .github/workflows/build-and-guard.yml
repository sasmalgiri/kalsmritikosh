name: Build + Guards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: kalsmritikosh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Architecture guards ────────────────────────────────────────────────────
  # Grep-only invariants; no Xcode needed, so they run fast on Linux as their own
  # named status check. Logic lives in versioned scripts (ci/guards/) so the exact
  # same guards run locally: `bash ci/guards/run-all.sh`.
  architecture-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Run architecture guards
        run: bash ci/guards/run-all.sh 2>&1 | tee guards.log
      - name: Upload guard logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guard-logs
          path: guards.log
          retention-days: 14
          if-no-files-found: ignore

  # ── Build + full test target ───────────────────────────────────────────────
  # Runs on macos-26 to match the LOCKED macOS 26 release contract (SHIP_DECISIONS.md):
  # the SDK builds the app's 26.x deployment target natively, so there is NO
  # deployment-target downgrade. The full KalsmritikoshTests target MUST execute
  # (it is wired into the shared scheme's Test action); a build-only or zero-test
  # run is a hard failure, proven from the .xcresult by ci/verify-xcresult-tests.sh.
  #
  # NOTE: if a future hosted runner lacks the macOS 26 SDK, a MACOSX_DEPLOYMENT_TARGET
  # override may be reintroduced ONLY as a clearly-labelled compatibility-CI override —
  # it would NOT be evidence that the locked macOS 26 contract passed.
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Select Xcode (newest available on the runner)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; else sudo xcode-select -s /Applications/Xcode.app; fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Build (Debug)
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild \
            -project Kalsmritikosh.xcodeproj \
            -scheme Kalsmritikosh \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/derived \
            -skipMacroValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Test (full KalsmritikoshTests target)
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          rm -rf build/TestResults.xcresult
          xcodebuild \
            -project Kalsmritikosh.xcodeproj \
            -scheme Kalsmritikosh \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/derived \
            -resultBundlePath build/TestResults.xcresult \
            -skipMacroValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Verify tests actually executed (from .xcresult, not console text)
        run: bash ci/verify-xcresult-tests.sh build/TestResults.xcresult ci/test-baseline.json 2>&1 | tee verify.log

      - name: Upload logs + result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            build.log
            test.log
            verify.log
            build/TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore

name: Build + Guards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Select Xcode (latest stable on macos-15 runner)
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Build (Debug)
        env:
          NSUnbufferedIO: YES
        run: |
          # pipefail so xcodebuild's real exit status propagates through tee —
          # no `grep || true` masking the failure (A0.5 / spec §5.3).
          set -o pipefail
          xcodebuild \
            -project Kalsmritikosh.xcodeproj \
            -scheme Kalsmritikosh \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/derived \
            -skipMacroValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Unit tests
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          # Run tests only once a test action is wired into the scheme (A0.6 is
          # an Xcode/pbxproj step). Until then, report clearly instead of a
          # false green — do NOT claim tests passed when none ran.
          if xcodebuild -project Kalsmritikosh.xcodeproj -scheme Kalsmritikosh -showBuildSettings -json 2>/dev/null >/dev/null \
             && xcodebuild -project Kalsmritikosh.xcodeproj -list 2>/dev/null | grep -q "KalsmritikoshTests"; then
            xcodebuild \
              -project Kalsmritikosh.xcodeproj \
              -scheme Kalsmritikosh \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath build/derived \
              -skipMacroValidation \
              CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO \
              test 2>&1 | tee test.log
          else
            echo "::warning::No KalsmritikoshTests target wired yet — tests NOT run (A0.6, Xcode step). This check is not a test pass."
          fi

      - name: Capability-discipline grep guard
        run: |
          # No model names may appear in Experts / Brain / Knowledge /
          # Retrieval / Ingestion. Routing/Providers + ModelManifest +
          # AppState + SettingsView are the ONLY allowed namers.
          set +e
          MATCHES=$(grep -rniE "qwen|gemma|deepseek|llama|mistral|nomic|gpt" \
            Kalsmritikosh/Experts/ \
            Kalsmritikosh/Brain/ \
            Kalsmritikosh/Knowledge/ \
            Kalsmritikosh/Retrieval/ \
            Kalsmritikosh/Ingestion/ \
            2>/dev/null | grep -vEi "//.*(ollama|llama3|model name|reference)" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Grep guard failed — model names leaked into capability-discipline layers"
            echo "$MATCHES"
            exit 1
          fi
          echo "Grep guard clean."

      - name: No try! / fatalError outside UI
        run: |
          set +e
          MATCHES=$(grep -rnE "try!|fatalError\(" Kalsmritikosh/ \
            --include="*.swift" \
            2>/dev/null | grep -vE "^Kalsmritikosh/UI/" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::try! or fatalError() found in non-UI code"
            echo "$MATCHES"
            exit 1
          fi
          echo "No try! / fatalError() in non-UI code."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          retention-days: 7
          if-no-files-found: ignore

name: Build + Guards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: kalsmritikosh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Architecture guards ────────────────────────────────────────────────────
  # Grep-only invariants; no Xcode needed, so they run fast on Linux as their own
  # named status check. Logic lives in versioned scripts (ci/guards/) so the exact
  # same guards run locally: `bash ci/guards/run-all.sh`.
  architecture-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false
      - name: Run architecture guards
        # pipefail is REQUIRED: without it the pipe into tee masks the guard
        # script's exit code and a failing guard shows green (audit 2026-08-25).
        run: |
          set -o pipefail
          bash ci/guards/run-all.sh 2>&1 | tee guards.log
      - name: Upload guard logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guard-logs
          path: guards.log
          retention-days: 14
          if-no-files-found: ignore

  # ── Build + full test target ───────────────────────────────────────────────
  # Runs on macos-26 because the macOS 26 SDK is required to COMPILE the
  # runtime-gated Foundation Models paths (#if canImport(FoundationModels)) and to
  # exercise the FM-available branch in tests. The shipping floor itself is
  # macOS 15.6, capability-adaptive (SHIP_DECISIONS.md GOV-004) — deployment
  # targets are pinned 15.6 uniformly (enforced by ci/guards/release-configuration.sh),
  # so tests execute natively on the runner with no deployment-target override.
  # The deterministic-only behaviour on a real macOS 15.6–25 Mac is an
  # owner-acceptance item; a green run here does NOT prove it.
  # The full KalsmritikoshTests target MUST execute (it is wired into the shared
  # scheme's Test action); a build-only or zero-test run is a hard failure,
  # proven from the .xcresult by ci/verify-xcresult-tests.sh.
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false

      - name: Select Xcode (newest available on the runner)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; else sudo xcode-select -s /Applications/Xcode.app; fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Build (Debug)
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild \
            -project Kalsmritikosh.xcodeproj \
            -scheme Kalsmritikosh \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/derived \
            -skipMacroValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Test (full KalsmritikoshTests target)
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          # No deployment-target override: the uniform 15.6 floor (GOV-004) executes
          # natively on any macOS 26 runner. The former 26.5 test-target pin (and its
          # labelled compatibility override) is gone.
          echo "Runner macOS: $(sw_vers -productVersion)"
          rm -rf build/TestResults.xcresult
          xcodebuild \
            -project Kalsmritikosh.xcodeproj \
            -scheme Kalsmritikosh \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/derived \
            -resultBundlePath build/TestResults.xcresult \
            -skipMacroValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Verify tests actually executed (from .xcresult, not console text)
        run: |
          # pipefail so the verifier's exit code propagates through `tee` — without it the
          # pipeline returns tee's 0 and the gate could never fail the job.
          set -o pipefail
          bash ci/verify-xcresult-tests.sh build/TestResults.xcresult ci/test-baseline.json 2>&1 | tee verify.log

      - name: Standalone verifier vs production-shaped bundle + attack matrix
        run: |
          set -euo pipefail
          # The test suite leaves a PRODUCTION-SHAPED bundle (run-bound, facts,
          # evidence manifest) at a stable temp path. The standalone CLI must
          # accept it, and must REFUSE every attack below.
          FIXTURE=$(find "$HOME/Library/Containers" /tmp "${TMPDIR:-/tmp}" -maxdepth 6 -type d -name "kalverify-fixture" 2>/dev/null | head -1)
          test -n "$FIXTURE" || { echo "::error::kalverify fixture not found"; exit 1; }
          echo "fixture: $FIXTURE"
          swift verifier/kalverify.swift "$FIXTURE"
          # Attack 1 — edited file: INTEGRITY must fail.
          rm -rf /tmp/kv-edit && cp -R "$FIXTURE" /tmp/kv-edit && printf ' ' >> /tmp/kv-edit/protocol.json
          if swift verifier/kalverify.swift /tmp/kv-edit; then echo "::error::edited bundle verified"; exit 1; fi
          # Attack 2 — facts-deletion downgrade with regenerated manifest: REPLAY must fail.
          rm -rf /tmp/kv-downgrade && cp -R "$FIXTURE" /tmp/kv-downgrade
          rm /tmp/kv-downgrade/evaluation-facts.json
          python3 - <<'PY'
          import json, hashlib, os
          d = "/tmp/kv-downgrade"
          files = {}
          for f in sorted(os.listdir(d)):
              if f in ("manifest.json", "README.txt"): continue
              files[f] = hashlib.sha256(open(os.path.join(d, f), "rb").read()).hexdigest()
          open(os.path.join(d, "manifest.json"), "w").write(
              json.dumps({"formatVersion": 1, "files": files}, sort_keys=True, separators=(",", ":")))
          PY
          if swift verifier/kalverify.swift /tmp/kv-downgrade; then echo "::error::facts-deletion downgrade verified"; exit 1; fi
          # Attack 3 — wrong trusted signer key: AUTHENTICITY must fail.
          if swift verifier/kalverify.swift "$FIXTURE" deadbeefdeadbeef; then echo "::error::wrong trusted key verified"; exit 1; fi
          echo "kalverify attack matrix: all attacks refused, clean bundle verified."

      - name: Upload logs + result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            build.log
            test.log
            verify.log
            build/TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore

  # ── Release-configuration build gate ──────────────────────────────────────
  # The TRUE Release configuration must compile (a Debug build is never release
  # verification). Added 2026-08-07 after discovering Release had NEVER built:
  # DEBUG-only SensitiveAccessContext.testUnrestricted() was referenced from
  # production UI/Brain/EvalKit paths (OPS-003C debt). This gate keeps every PR
  # honest about the shipping configuration.
  release-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false
      - name: Select Xcode (newest available on the runner)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; else sudo xcode-select -s /Applications/Xcode.app; fi
          xcodebuild -version
      - name: Build (Release)
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild \
            -project Kalsmritikosh.xcodeproj \
            -scheme Kalsmritikosh \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/release-derived \
            -skipMacroValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee release-build.log
          grep -q "BUILD SUCCEEDED" release-build.log
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log
          retention-days: 14
          if-no-files-found: ignore

  # ── Specialized gates (CI-001B / CI-001C) ─────────────────────────────────
  # Independently-enforceable named checks over versioned test groups
  # (ci/test-groups/*.json). Each runs in isolated build paths and verifies its own
  # .xcresult (required suites ran, count >= floor, 0 failures) via ci/verify-xcresult-group.sh.
  # These are IN ADDITION to build-and-test (the overall regression gate), not a replacement.
  migration-matrix:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false
      - name: Select Xcode (newest available on the runner)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; else sudo xcode-select -s /Applications/Xcode.app; fi
          xcodebuild -version
      - name: Run migration-matrix group
        env:
          NSUnbufferedIO: YES
        run: bash ci/run-xcode-test-group.sh ci/test-groups/migration-matrix.json
      - name: "Report: synthetic vs owner archive"
        run: |
          echo "Synthetic migration tests: PASS (RealArchiveMigrationTests uses a synthetic on-disk archive)."
          echo "Sanitized owner archive: NOT RUN (owner step — ci/migrations/verify-real-archive.sh). Never counted as real-data verification."
      - name: Upload logs + result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-matrix-logs
          path: build/migration-matrix
          retention-days: 14
          if-no-files-found: ignore

  parser-fixtures:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false
      - name: Select Xcode (newest available on the runner)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; else sudo xcode-select -s /Applications/Xcode.app; fi
          xcodebuild -version
      - name: Run parser-fixtures group
        env:
          NSUnbufferedIO: YES
        run: bash ci/run-xcode-test-group.sh ci/test-groups/parser-fixtures.json
      - name: "Status note"
        run: echo "A green parser-fixtures job proves the CURRENTLY REGISTERED parser fixtures; it does NOT close release gate F1 (complete advertised-format matrix)."
      - name: Upload logs + result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parser-fixtures-logs
          path: build/parser-fixtures
          retention-days: 14
          if-no-files-found: ignore

  report-receipt-integrity:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false
      - name: Select Xcode (newest available on the runner)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; else sudo xcode-select -s /Applications/Xcode.app; fi
          xcodebuild -version
      - name: Run report-receipt-integrity group
        env:
          NSUnbufferedIO: YES
        run: bash ci/run-xcode-test-group.sh ci/test-groups/report-receipt-integrity.json
      - name: Upload logs + result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-receipt-integrity-logs
          path: build/report-receipt-integrity
          retention-days: 14
          if-no-files-found: ignore

  # ── CI-001C: SensitiveScope cross-surface enforcement gate ─────────────────
  # Requires all OPS-003 suites AND the 10-test E2E cross-surface suite to pass.
  # S2 moves from IMPLEMENTED → PASS after this job turns hosted-green.
  sensitive-export:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false
      - name: Select Xcode (newest available on the runner)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; else sudo xcode-select -s /Applications/Xcode.app; fi
          xcodebuild -version
      - name: Run sensitive-export group
        env:
          NSUnbufferedIO: YES
        run: bash ci/run-xcode-test-group.sh ci/test-groups/sensitive-export.json
      - name: Upload logs + result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sensitive-export-logs
          path: build/sensitive-export
          retention-days: 14
          if-no-files-found: ignore
